<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b7fff"/>
      <stop offset="55%" stop-color="#ff4fa3"/>
      <stop offset="100%" stop-color="#ff5c5c"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5b7fff"/>
      <stop offset="100%" stop-color="#ff4fa3"/>
    </linearGradient>
  </defs>

  <!-- Left page: handwritten scribbles -->
  <g transform="translate(60,60)">
    <rect width="260" height="300" rx="16" fill="#14162a" stroke="#262a4a" stroke-width="2"/>
    <path d="M25 20 Q35 10 45 20 Q55 30 65 20 Q75 10 85 20 Q95 30 105 20 Q115 10 125 20"
          fill="none" stroke="#8d90ac" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 55 Q40 45 55 55 Q70 65 85 55 Q100 45 115 55 Q130 65 145 55 Q160 45 175 55"
          fill="none" stroke="#8d90ac" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 90 Q38 80 51 90 Q64 100 77 90 Q90 80 103 90"
          fill="none" stroke="#8d90ac" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 125 Q45 112 65 125 Q85 138 105 125 Q125 112 145 125 Q165 138 185 125 Q195 118 205 125"
          fill="none" stroke="#8d90ac" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 160 Q40 150 55 160 Q70 170 85 160"
          fill="none" stroke="#8d90ac" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 195 Q45 182 65 195 Q85 208 105 195 Q125 182 145 195"
          fill="none" stroke="#8d90ac" stroke-width="3" stroke-linecap="round"/>
    <path d="M25 230 Q38 220 51 230 Q64 240 77 230 Q90 220 103 230 Q116 240 129 230"
          fill="none" stroke="#8d90ac" stroke-width="3" stroke-linecap="round"/>
    <text x="130" y="285" text-anchor="middle" fill="#8d90ac" font-family="Arial, sans-serif" font-size="15">Your handwriting</text>
  </g>

  <!-- Scan beam / arrow connecting the two pages -->
  <g transform="translate(330,180)">
    <line x1="0" y1="30" x2="130" y2="30" stroke="url(#arrowGrad)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="130,18 155,30 130,42" fill="#ff4fa3"/>
    <circle cx="65" cy="30" r="46" fill="none" stroke="url(#arrowGrad)" stroke-width="2" opacity="0.35"/>
    <image href="favicon.svg" x="35" y="0" width="60" height="60"/>
  </g>

  <!-- Right page: clean digital text -->
  <g transform="translate(500,60)">
    <rect width="260" height="300" rx="16" fill="#14162a" stroke="#ff4fa3" stroke-width="2"/>
    <rect x="25" y="20" width="170" height="8" rx="4" fill="url(#heroGrad)"/>
    <rect x="25" y="45" width="210" height="8" rx="4" fill="#eef0fb" opacity="0.9"/>
    <rect x="25" y="65" width="195" height="8" rx="4" fill="#eef0fb" opacity="0.75"/>
    <rect x="25" y="85" width="150" height="8" rx="4" fill="#eef0fb" opacity="0.6"/>
    <rect x="25" y="115" width="210" height="8" rx="4" fill="#eef0fb" opacity="0.9"/>
    <rect x="25" y="135" width="180" height="8" rx="4" fill="#eef0fb" opacity="0.75"/>
    <rect x="25" y="155" width="205" height="8" rx="4" fill="#eef0fb" opacity="0.6"/>
    <rect x="25" y="185" width="160" height="8" rx="4" fill="#eef0fb" opacity="0.9"/>
    <rect x="25" y="205" width="210" height="8" rx="4" fill="#eef0fb" opacity="0.75"/>
    <rect x="25" y="225" width="140" height="8" rx="4" fill="#eef0fb" opacity="0.6"/>
    <text x="130" y="285" text-anchor="middle" fill="#ff4fa3" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Clean digital text</text>
  </g>

  <!-- decorative sparkles -->
  <circle cx="40" cy="30" r="3" fill="#ff4fa3" opacity="0.7"/>
  <circle cx="770" cy="40" r="2.5" fill="#5b7fff" opacity="0.7"/>
  <circle cx="400" cy="20" r="2" fill="#ff5c5c" opacity="0.6"/>
  <circle cx="720" cy="380" r="3" fill="#5b7fff" opacity="0.6"/>
  <circle cx="30" cy="390" r="2.5" fill="#ff4fa3" opacity="0.6"/>
</svg>
